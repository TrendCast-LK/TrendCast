name: Model artifacts

# Loads the CatBoost + HistAttnV2 ensemble from ensemble_artifacts/ through
# the real inference code and checks it (test_ensemble_artifacts.py). Heavy
# (CPU torch plus two CLIP models from Hugging Face), so it only runs when the
# model files or the code that serves them change. The reference-case tests
# need the training corpus in artifacts/, which is not in git, so they skip
# here; the load, config and determinism checks still run.
on:
  push:
    branches: [main]
    paths:
      - ensemble_artifacts/**
      - backend/inference.py
      - backend/histattn.py
      - backend/channel_cache.py
      - backend/requirements.txt
      - backend/tests/test_ensemble_artifacts.py
      - .github/workflows/model.yml
  pull_request:
    paths:
      - ensemble_artifacts/**
      - backend/inference.py
      - backend/histattn.py
      - backend/channel_cache.py
      - backend/requirements.txt
      - backend/tests/test_ensemble_artifacts.py
      - .github/workflows/model.yml
  workflow_dispatch:

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensemble:
    name: Ensemble artifact tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # CPU wheels: the GPU build of torch is several GB larger and unused here.
      - name: Install dependencies
        run: |
          pip install "$(grep -E '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('ensemble_artifacts/config.json') }}

      - name: Run model tests
        run: python -m pytest -q -p no:cacheprovider tests/test_ensemble_artifacts.py
