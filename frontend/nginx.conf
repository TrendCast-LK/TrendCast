server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Prediction uploads: thumbnails up to 10 MB, datasets up to 50 MB.
    client_max_body_size 64m;

    # API and uploaded files, served by the backend container. The trailing
    # slash strips /api, so /api/auth/login reaches the backend as /auth/login.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A forecast (or an admin page against a slow database) can take a while.
        proxy_read_timeout 300s;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /admin/users/5, ...) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
