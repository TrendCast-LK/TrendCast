# A disposable Postgres for load testing, on a port that will not clash with anything else.
#   docker compose -f backend/tests/load/docker-compose.load.yml up -d
#   LOAD_TEST_DB_URL=postgresql://postgres:loadtest@127.0.0.1:55432/postgres
# pgvector image because schema/init/04_video_features.sql needs the `vector` extension.
# pg_stat_statements is preloaded so monitor.py can report the most expensive queries.
services:
  loaddb:
    image: pgvector/pgvector:pg16
    container_name: trendcast-loaddb
    environment:
      POSTGRES_PASSWORD: loadtest
    ports:
      - "127.0.0.1:55432:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    tmpfs:
      - /var/lib/postgresql/data   # RAM-backed: fast, and gone when the container stops
